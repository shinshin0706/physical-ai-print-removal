[project]
name = "physical-ai-print-removal"
version = "0.1.0"
description = "Offline A1-size build-plate part recovery and restart gating prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gymnasium-robotics==1.4.2",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib==3.10.7",
    "mujoco==3.3.7",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "reportlab>=5.1.0",
    "torch>=2.15.0",
]

[tool.pytest.ini_options]
norecursedirs = ["submission", ".venv", "vendor"]
